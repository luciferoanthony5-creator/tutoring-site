<!DOCTYPE html>
<!-- GENERATED FILE. Do not edit this page by hand: scripts/build.py rewrites it.
     Change the lesson in content/lessons/ (or in the Pages CMS editor), or change templates/lesson.html to alter every lesson. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} – {{subject_title}} – {{site_name}}</title>
  <meta name="description" content="{{summary}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='16' r='7' fill='%23E4572E'/%3E%3Ccircle cx='22' cy='16' r='7' fill='%232B59FF'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<!-- The data- attributes tell nav.js which lesson this is (for the outline, breadcrumb and Previous/Next). -->
<body data-root="{{root}}" data-subject="{{subject}}" data-unit="{{unit_folder}}" data-lesson="{{slug}}">
<a class="skip" href="#main">Skip to content</a>

<!-- Header: the menu inside <ul id="menu"> is generated by nav.js -->
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="{{root}}index.html" data-site-name>{{site_name}}</a>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button>
    <ul class="menu" id="menu"></ul>
  </div>
</header>

<main class="page" id="main">
  <div class="wrap">
    <div>
      <h1>{{title}}</h1>
      <p class="lede">{{summary}}</p>
{{byline}}    </div>
{{video}}{{downloads}}    <!-- Reserved ad slot (Phase 4). Remove "hidden" when AdSense is set up. -->
    <div class="ad-slot" hidden></div>
    <nav class="prevnext" data-prevnext aria-label="Lesson navigation"></nav>
  </div>
</main>

<footer>
  <div class="wrap">
    <span id="footer-name"></span>
    <span>Worksheets are free for classroom use.</span>
    <a href="{{root}}index.html">Home</a>
    <a href="{{root}}about.html">About</a>
    <a href="{{root}}privacy.html">Privacy</a>
  </div>
</footer>

<!-- lessons.js = the list of subjects/units/lessons; nav.js builds menus from it -->
<script src="{{root}}assets/lessons.js"></script>
<script src="{{root}}assets/nav.js"></script>
</body>
</html>
